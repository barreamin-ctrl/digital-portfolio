<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kontakta Mr X om webbutveckling, projekt och samarbeten.">
    <title>Kontakt – Mr X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
<header class="header">
    <div class="header__logo">Mr X – Portfolio</div>
    <nav class="header__nav" aria-label="Huvudmeny">
        <ul class="header__list">
            <li class="header__item"><a href="index.html" class="header__link">Hem</a></li>
            <li class="header__item"><a href="projekt.html" class="header__link">Projekt</a></li>
            <li class="header__item"><a href="kompetenser.html" class="header__link">Kompetenser</a></li>
            <li class="header__item"><a href="utbildning.html" class="header__link">Utbildning</a></li>
            <li class="header__item"><a href="kontakt.html" class="header__link header__link--active" aria-current="page">Kontakt</a></li>
        </ul>
    </nav>
</header>

<main class="main">
    <section class="contact">
        <h1 class="contact__title">Kontakta Mr X</h1>
        <p class="contact__intro">
            Har du frågor om mina projekt eller vill diskutera ett samarbete?
            Fyll i formuläret nedan.
        </p>

        <form class="contact__form" action="tack.php" method="post">
            <p class="contact__field">
                <label for="name">Namn</label>
                <input type="text" id="name" name="name"
                       autocomplete="name" required>
            </p>

            <p class="contact__field">
                <label for="email">E-post</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </p>

            <p class="contact__field">
                <label for="subject">Vad gäller ditt meddelande?</label>
                <select id="subject" name="subject" required>
                    <option value="">Välj ett ämne</option>
                    <option value="projekt">Projekt</option>
                    <option value="samarbete">Samarbete</option>
                    <option value="annat">Annat</option>
                </select>
            </p>

            <fieldset class="contact__field">
                <legend>Vill du bli kontaktad via e-post?</legend>
                <input type="radio" id="reply-yes"
                       name="reply" value="ja" required>
                <label for="reply-yes">Ja</label>

                <input type="radio" id="reply-no"
                       name="reply" value="nej">
                <label for="reply-no">Nej</label>
            </fieldset>

            <p class="contact__field">
                <label for="message">Meddelande</label>
                <textarea id="message" name="message"
                          rows="5" required></textarea>
            </p>

            <button class="contact__button" type="submit">
                Skicka meddelande
            </button>
        </form>
    </section>
</main>

<footer class="footer">
    <p class="footer__text">&copy; 2026 Digital Portfolio. Alla rättigheter förbehållna.</p>
</footer>


<script src="main.js"></script>
</body>
</html>
